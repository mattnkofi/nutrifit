name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Sync Capacitor Android platform
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NutriFit.apk

      - name: Publish APK release asset
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nutrifit-${{ github.run_number }}
          name: NutriFit
          draft: false
          prerelease: false
          generate_release_notes: false
          files: android/app/build/outputs/apk/debug/NutriFit.apk

      # GitHub Actions artifacts are ALWAYS zipped by GitHub and cannot be made
      # a raw .apk. The Release asset above is the real APK. Surface a direct
      # download link so it's the obvious thing to click.
      - name: Add APK download link to job summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## 📱 NutriFit APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the raw APK (not a zip):" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[NutriFit.apk](https://github.com/${{ github.repository }}/releases/download/nutrifit-${{ github.run_number }}/NutriFit.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Always-latest link:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download latest NutriFit.apk](https://github.com/${{ github.repository }}/releases/latest/download/NutriFit.apk)" >> "$GITHUB_STEP_SUMMARY"